// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Lock the application dependency graph in a repository-owned file. Expo and RN
// subprojects under node_modules are immutable inputs from package-lock.json;
// their resolved transitive dependencies are captured by the app classpaths.
project(':app') {
    configurations.matching {
        it.name in ['debugCompileClasspath', 'debugRuntimeClasspath',
                    'releaseCompileClasspath', 'releaseRuntimeClasspath']
    }.configureEach {
        resolutionStrategy.activateDependencyLocking()
    }
    dependencyLocking {
        lockMode = LockMode.STRICT
    }
}

// Resolve both variants for lock refresh and graph validation. Only an explicit
// --write-locks changes state; CI never passes that flag.
tasks.register('resolveDependencyLocks') {
    doLast {
        ['debugCompileClasspath', 'debugRuntimeClasspath',
         'releaseCompileClasspath', 'releaseRuntimeClasspath'].each { name ->
            def result = project(':app').configurations.getByName(name).incoming.resolutionResult
            result.allDependencies.each { dependency ->
                if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                    throw new GradleException("Cannot resolve ${name}: ${dependency.attempted}", dependency.failure)
                }
            }
        }
    }
}

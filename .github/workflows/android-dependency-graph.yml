name: Android dependency graph

on:
  push:
    branches: [main]
    paths:
      - android/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/android-dependency-graph.yml
  schedule:
    - cron: '20 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dependency-graph-main
  cancel-in-progress: false

jobs:
  submit:
    # Never resolve PR code with a write token. Manual runs must select main.
    if: github.ref == 'refs/heads/main' && github.repository == 'hiteshjoshi1/tracker'
    name: Submit resolved Android dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stable key also replaces the initial locally generated main snapshot.
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: tracker-android-main-manual
    permissions:
      contents: write # Dependency Submission API requires this permission.
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install committed native package sources
        run: npm ci --no-audit --no-fund
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve locked variants and submit graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android
          dependency-resolution-task: resolveDependencyLocks :ForceDependencyResolutionPlugin_resolveAllDependencies
          additional-arguments: --no-configuration-cache -PreactNativeArchitectures=arm64-v8a
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          cache-provider: basic
          cache-read-only: true
      - name: Ensure resolution preserved committed dependencies
        run: git diff --exit-code -- package.json package-lock.json android

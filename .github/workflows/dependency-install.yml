name: Dependency install

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-install:
    name: Reproducible npm install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/firebase/package-lock.json
      - name: Install the committed dependency trees
        run: |
          npm ci --no-audit --no-fund
          if test -f tools/firebase/package.json; then
            npm ci --prefix tools/firebase --no-audit --no-fund
          fi
      - name: Ensure install did not rewrite manifests or lockfiles
        run: git diff --exit-code -- package.json package-lock.json tools/firebase/package.json tools/firebase/package-lock.json

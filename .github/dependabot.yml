version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tools/firebase
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    labels: ["kind:security"]
    groups:
      expo-react-native:
        applies-to: version-updates
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - react
          - react-dom
          - react-test-renderer
          - "@types/react"
          - "@types/react-test-renderer"
          - jest-expo
          - react-native
          - react-native-*
          - "@react-native/*"
          - "@react-native-*/*"
      expo-react-native-security:
        applies-to: security-updates
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - react
          - react-dom
          - react-test-renderer
          - "@types/react"
          - "@types/react-test-renderer"
          - jest-expo
          - react-native
          - react-native-*
          - "@react-native/*"
          - "@react-native-*/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    labels: ["kind:security"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    labels: ["kind:security"]
